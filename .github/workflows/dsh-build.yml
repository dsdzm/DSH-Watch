# DSH Android 构建模板
#
# 由手表端 App 的 cloud_build 工具触发，用来在云端构建本项目的 APK ——
# 手表上改代码、云端出可安装的包，这是本机永远做不到的那一类需求。
#
# 说明：release 包需要签名密钥（仓库里不含密钥，见 README 的「正式签名」）。
# 想在云端出正式签名包，把 keystore 用 base64 存进仓库 Secrets
# 并在这里解码即可；默认产出的是可直接安装的 debug 包。

name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建类型'
        required: false
        type: choice
        options:
          - debug
          - release
        default: debug
      with_python:
        description: '是否打包 Python 引擎（full 版，约 30MB）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Android 构建很吃时间：首次要下载 Gradle 与依赖
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python (供 full 包使用)
        if: ${{ inputs.with_python }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ARGS=":app:assemble${{ inputs.variant == 'release' && 'Release' || 'Debug' }}"
          if [ "${{ inputs.with_python }}" = "true" ]; then
            ARGS="$ARGS -PwithPython=true"
          fi
          chmod +x ./gradlew
          ./gradlew $ARGS --no-daemon

      - name: Collect APKs
        if: always()
        shell: bash
        run: |
          mkdir -p dsh-out
          find app/build/outputs/apk -name "*.apk" -exec cp {} dsh-out/ \; || true
          ls -la dsh-out || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dsh-out
          if-no-files-found: warn
          retention-days: 14
