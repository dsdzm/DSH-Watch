# ---- JVM ----
# release 的 R8 + 资源压缩很吃内存，3G 会被 OOM kill，这里给到 4G
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# worker 不加限制会同时拉起太多，反而容易把构建进程挤爆
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---- AndroidX ----
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# ---- Kotlin ----
# 编译 daemon 默认继承 org.gradle.jvmargs（4G），而且默认 2 小时不退出。
# 于是「Gradle 4G + Kotlin daemon 4G」在 8G 的容器里必然撞墙，
# 表现为 R8 阶段报 "Gradle build daemon disappeared unexpectedly"。
# 单独限制它，并让它编译完就退出。
kotlin.daemon.jvmargs=-Xmx1536m
kotlin.code.style=official
kotlin.incremental=true
