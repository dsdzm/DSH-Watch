# DSH 通用云端执行模板
#
# 由手表端 App 的 cloud_build 工具触发（workflow_dispatch）。
# 用途：在云端跑手表上跑不了的东西 —— 编译、跑测试、生成二进制。
#
# 约定：命令把产物写到 dsh-out/，这个目录会被作为 artifact 上传，
# 手表端会自动下载并解压到当前会话工作目录的 artifacts/ 下。
#
# dsh-out/ 为空时会自动从常见目录（app/build/outputs、build、dist、out、target/release…）
# 收集 apk / aab / jar / zip / so / exe / whl —— 但**构建 Android 请用 dsh-build.yml**：
# 那个模板会装好 JDK 17 与 Android SDK，而这个模板只有基础 Ubuntu 环境。

name: DSH Run

on:
  workflow_dispatch:
    inputs:
      command:
        description: '要执行的命令（产物请写到 dsh-out/ 目录）'
        required: true
        type: string
      artifact_name:
        description: '产物名称'
        required: false
        type: string
        default: dsh-output
      artifact_path:
        description: '要上传的路径（glob，默认 dsh-out）'
        required: false
        type: string
        default: dsh-out
      retention_days:
        description: '产物保留天数'
        required: false
        type: number
        default: 7

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 防跑飞：一个死循环命令不该占满整个账户的额度
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare output dir
        run: mkdir -p dsh-out

      - name: Execute
        # 命令经环境变量传入再由 bash 执行：
        # 直接插值进 run: 会被 YAML 与 shell 的双重转义规则咬到
        # （引号、$、反引号都可能变形），这条路上出错极难排查。
        env:
          DSH_COMMAND: ${{ inputs.command }}
        run: bash -c "$DSH_COMMAND"

      - name: Collect outputs
        # dsh-out/ 为空时自动捞一遍常见构建产物目录。
        #
        # 为什么要有这一步：约定是"产物写到 dsh-out/"，但真实使用里没人记得住 ——
        # 用户让模型跑 `./gradlew assembleDebug`，APK 在 app/build/outputs/apk/ 下，
        # 而模板只上传 dsh-out/，于是"构建成功但拿不到产物"。
        # 与其反复强调约定，不如让模板自己找一遍。
        if: always()
        shell: bash
        run: |
          mkdir -p dsh-out
          if [ -n "$(ls -A dsh-out 2>/dev/null)" ]; then
            echo "[dsh] dsh-out 已有内容，跳过自动收集"
            ls -la dsh-out
            exit 0
          fi
          echo "[dsh] dsh-out 为空，自动收集常见产物"
          for dir in app/build/outputs build/outputs build dist out target/release target/debug bin; do
            [ -d "$dir" ] || continue
            find "$dir" -maxdepth 5 -type f \
              \( -name "*.apk" -o -name "*.aab" -o -name "*.jar" -o -name "*.zip" \
                 -o -name "*.tar.gz" -o -name "*.so" -o -name "*.exe" -o -name "*.whl" \) \
              -size -80M -exec cp -n {} dsh-out/ \; 2>/dev/null || true
          done
          ls -la dsh-out || true

      - name: Upload artifacts
        # always()：失败时也要把日志/中间产物留下，否则手表端只能看到"失败了"三个字
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}
