<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden;background:#070A0F;
    font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif;color:#EDF1F7}
  .bg{position:absolute;inset:0;background:
    radial-gradient(760px 460px at 16% -6%,rgba(76,111,255,.26),transparent 62%),
    radial-gradient(620px 420px at 92% 12%,rgba(125,211,252,.13),transparent 64%),#070A0F}
  .grid{position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:50px 50px;
    -webkit-mask-image:radial-gradient(circle at 55% 45%,#000 10%,transparent 76%)}
  .vig{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 40%,rgba(0,0,0,.78) 100%)}
  .wrap{position:absolute;inset:0;display:flex;align-items:center;padding:0 76px;gap:40px}
  .left{flex:1;z-index:3}
  .eyebrow{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.22em;color:#7DD3FC;
    font-family:ui-monospace,monospace;margin-bottom:26px}
  .eyebrow i{width:26px;height:1px;background:#7DD3FC;display:block;opacity:.8}
  h1{font-size:104px;line-height:1.06;letter-spacing:-.045em;font-weight:800}
  h1 .a{color:#FFFFFF}
  h1 .b{display:block;background:linear-gradient(96deg,#7DD3FC,#4C6FFF 72%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:26px;font-size:23px;color:#9AA9BD;letter-spacing:.01em}
  .meta{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap}
  .tag{font-size:15px;color:#B9C6D8;border:1px solid #27313F;background:rgba(255,255,255,.03);
    padding:7px 14px;border-radius:99px}
  .tag b{color:#7DD3FC;font-weight:600}

  .right{width:440px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;position:relative}
  .halo{position:absolute;width:520px;height:520px;border-radius:50%;
    background:conic-gradient(from 40deg,rgba(76,111,255,0),rgba(76,111,255,.35),rgba(125,211,252,.22),rgba(76,111,255,0));
    filter:blur(48px)}
  .watch{position:relative;width:300px;height:366px;transform:rotate(-7deg)}
  .case{position:absolute;inset:0;border-radius:46px;padding:8px;
    background:linear-gradient(155deg,#3C4A5F,#161D27 40%,#2E3A4B 64%,#10151C);
    box-shadow:0 34px 80px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.09) inset}
  .scr{position:absolute;inset:8px;border-radius:39px;background:#05080D;overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.9) inset}
  .bar{display:flex;justify-content:space-between;padding:14px 22px;font-size:10px;color:#8FA0B6}
  .msg{margin:10px 18px}
  .bub-u{background:#23408F;color:#EAF0FF;font-size:12px;padding:9px 12px;border-radius:14px 14px 4px 14px;
    width:fit-content;margin-left:auto;line-height:1.5;max-width:86%}
  .tool{margin-top:10px;border:1px solid #1D2A39;background:#0B1119;border-radius:11px;padding:9px 11px;font-size:10px;color:#8FA6C4}
  .tool .fn{color:#C9D6E9;font-family:ui-monospace,monospace;font-size:10px;margin-top:3px}
  .tool .ok{color:#3DDC97;margin-top:4px}
  .ans{margin-top:9px;border:1px solid #1B2634;background:#0E151E;border-radius:11px;
    padding:9px 11px;font-size:11px;line-height:1.65;color:#D5DFEC}
  .cursor{display:inline-block;width:2px;height:11px;background:#4C6FFF;vertical-align:-1px;margin-left:2px}
  .badge{position:absolute;right:-6px;bottom:8px;background:rgba(10,16,24,.92);border:1px solid #2A3746;
    border-radius:12px;padding:9px 14px;font-size:13px;color:#C6D3E4;box-shadow:0 12px 30px rgba(0,0,0,.6)}
  .badge b{color:#3DDC97}
  .foot{position:absolute;left:76px;bottom:38px;font-size:14px;color:#5F7189;letter-spacing:.06em;
    font-family:ui-monospace,monospace;z-index:4}
  .foot b{color:#8FA0B6;font-weight:500}
</style></head>
<body>
  <div class="bg"></div><div class="grid"></div><div class="vig"></div>
  <div class="wrap">
    <div class="left">
      <div class="eyebrow"><i></i>DSH WATCH · 本地引擎</div>
      <h1><span class="a">电脑关了</span><span class="b">它还在跑</span></h1>
      <div class="sub">把整个 Agent 装进手表，不经过电脑</div>
      <div class="meta">
        <span class="tag"><b>8.7MB</b> 一个 APK</span>
        <span class="tag"><b>51</b> 个工具</span>
        <span class="tag">不用电脑端</span>
      </div>
    </div>
    <div class="right">
      <div class="halo"></div>
      <div class="watch">
        <div class="case"></div>
        <div class="scr">
          <div class="bar"><span>09:41</span><span>82%</span></div>
          <div class="msg"><div class="bub-u">把 README 的版本号改成 1.22.0</div>
            <div class="tool">edit_file<div class="fn">/workspace/README.md</div><div class="ok">已写入 1 处 · 校验通过</div></div>
            <div class="ans">改好了。版本号从 1.21.0 更新到 1.22.0，其他行没有动。<span class="cursor"></span></div>
          </div>
        </div>
      </div>
      <div class="badge">电脑 <b>关机中</b> · 任务继续</div>
    </div>
  </div>
  <div class="foot">github.com/dsdzm/DSH-Watch　·　GPL-3.0</div>
</body></html>
